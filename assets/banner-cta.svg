<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 110" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="Discover Bangladeshi suppliers and exporters at bangladeshexport.com">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#063D2C"/>
      <stop offset="1" stop-color="#0B6B47"/>
    </linearGradient>
    <style>
      .arw{animation:arw 1.6s ease-in-out infinite}
      @keyframes arw{0%,100%{transform:translateX(0);opacity:.75}50%{transform:translateX(7px);opacity:1}}
      .rt{fill:none;stroke:#7CFFC4;stroke-width:1.4;stroke-dasharray:2 8;animation:fl 2.4s linear infinite}
      @keyframes fl{to{stroke-dashoffset:-60}}
    </style>
  </defs>
  <rect width="880" height="110" rx="14" fill="url(#cbg)"/>
  <path class="rt" d="M 600 20 Q 700 10 780 30"/>
  <path class="rt" d="M 620 90 Q 720 100 810 78"/>
  <circle cx="60" cy="34" r="12" fill="none" stroke="#7CFFC4" stroke-width="1.3"/>
  <ellipse cx="60" cy="34" rx="12" ry="5" fill="none" stroke="#7CFFC4" stroke-width="1"/>
  <line x1="48" y1="34" x2="72" y2="34" stroke="#7CFFC4" stroke-width="1"/>
  <text x="92" y="48" font-size="25" font-weight="700" fill="#FFFFFF">Source from Bangladesh to the World</text>
  <text x="92" y="78" font-size="15" fill="#BDEED6">21,000+ suppliers &#183; products &#183; RFQ &#183; trade resources</text>
  <g>
    <rect x="640" y="38" width="196" height="36" rx="18" fill="#052E21" stroke="#7CFFC4" stroke-width="1.2"/>
    <text x="672" y="61" font-size="16" font-weight="600" fill="#E8FFF4">bangladeshexport.com</text>
    <g class="arw"><path d="M 846 46 l 12 10 l -12 10" fill="none" stroke="#F4C95D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
</svg>